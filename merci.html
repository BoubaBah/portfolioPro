<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merci — Build &amp; Launch</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .thanks{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
  .thanks img{width:150px;margin:0 auto 32px;filter:drop-shadow(0 10px 40px rgba(0,202,254,.35));animation:float 6s ease-in-out infinite}
  .thanks p{color:var(--muted);max-width:480px;margin:0 auto 32px}
</style>
</head>
<body>
<div class="thanks">
  <div>
    <img src="assets/logo-mark.png" alt="Build & Launch">
    <h2 id="t">Message bien reçu 🚀</h2>
    <p id="p">Merci ! Votre demande est entre de bonnes mains. Vous recevrez une réponse très rapidement.</p>
    <a class="btn" href="index.html" id="b">Retour au site</a>
  </div>
</div>
<script>
  var l = new URLSearchParams(location.search).get('lang');
  if (!l) { try { l = localStorage.getItem('bl-lang'); } catch (e) {} }
  if (l === 'en') {
    document.documentElement.lang = 'en';
    document.title = 'Thank you — Build & Launch';
    document.getElementById('t').textContent = 'Message received 🚀';
    document.getElementById('p').textContent = 'Thank you! Your request is in good hands. You will hear back very soon.';
    document.getElementById('b').textContent = 'Back to the website';
  }
</script>
</body>
</html>
